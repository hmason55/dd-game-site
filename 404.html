<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDGame</title>

    <!-- Hosted at the root of dd-game.hmason55.dev -->
    <base href="/" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="theme-color" content="#0b1622">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/base/global.css" />
    <link rel="stylesheet" href="css/components/enemy.css" />
    <link rel="stylesheet" href="css/components/map.css" />
    <link rel="stylesheet" href="css/components/progression.css" />
    <link rel="stylesheet" href="css/components/backpack-dialog.css" />
    <!--<link rel="stylesheet" href="css/utilities/visual-effects.css" />-->
    <link rel="stylesheet" href="css/components/loading.css" />
    <link rel="stylesheet" href="css/components/error.css" />
    <link href="DDGame.styles.css" rel="stylesheet" />

    <script src="lib/htmlgl/htmlgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-gl@0.3.2/dist/htmlgl-effects.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/TextPlugin.min.js"></script>
</head>

<body>

    <div id="app" class="content">
        <div id="loading-container" class="loading-container">
            <h2 id="loading-message">...</h2>
            <div class="loading-progress">
                <div class="loading-bar"></div>
            </div>
        </div>
    </div>

    <div id="orientation-warning">Please rotate your device to landscape.</div>

    <div id="blazor-error-ui">
        <span class="message">An unexpected error occurred.</span>
        <a href="." class="reload">Restart</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        (function () {
            const WARNING_TEXT = "DDGame couldn't load because required scripts were blocked.";
            const INSTRUCTIONS_TEXT = "Privacy tools such as Brave Shields or other script blockers can stop the app from loading. Please allow scripts for this site or temporarily disable the blocker, then reload.";
            const RECOVERY_STORAGE_FLAG = "__ddgRecoveryAttempted";

            async function clearStartupBlockingState() {
                try {
                    localStorage.clear();
                } catch (error) {
                    console.warn("Unable to clear localStorage during startup recovery.", error);
                }

                try {
                    sessionStorage.clear();
                } catch (error) {
                    console.warn("Unable to clear sessionStorage during startup recovery.", error);
                }

                if (window.caches && typeof window.caches.keys === "function") {
                    try {
                        const cacheKeys = await window.caches.keys();
                        await Promise.all(cacheKeys.map((key) => window.caches.delete(key)));
                    } catch (error) {
                        console.warn("Unable to clear cache storage during startup recovery.", error);
                    }
                }

                if (navigator.serviceWorker && typeof navigator.serviceWorker.getRegistrations === "function") {
                    try {
                        const registrations = await navigator.serviceWorker.getRegistrations();
                        await Promise.all(registrations.map((registration) => registration.unregister()));
                    } catch (error) {
                        console.warn("Unable to unregister service workers during startup recovery.", error);
                    }
                }
            }

            async function restartWithRecovery(event) {
                event.preventDefault();

                const reloadTarget = event.currentTarget?.getAttribute("href") || ".";
                let hasAttemptedRecovery = false;

                try {
                    hasAttemptedRecovery = localStorage.getItem(RECOVERY_STORAGE_FLAG) === "true";
                } catch (error) {
                    console.warn("Unable to read localStorage during startup recovery.", error);
                    window.location.href = reloadTarget;
                    return;
                }

                if (window.__ddgBlazorStarted || hasAttemptedRecovery) {
                    window.location.href = reloadTarget;
                    return;
                }

                await clearStartupBlockingState();

                try {
                    localStorage.setItem(RECOVERY_STORAGE_FLAG, "true");
                } catch (error) {
                    console.warn("Unable to write localStorage recovery flag.", error);
                }

                window.location.href = `${reloadTarget}${reloadTarget.includes("?") ? "&" : "?"}ddg-recover=${Date.now()}`;
            }

            function registerRecoveryRestartHandler() {
                const reloadLink = document.querySelector("#blazor-error-ui a.reload");
                if (!reloadLink) {
                    return;
                }

                reloadLink.addEventListener("click", restartWithRecovery);
            }

            function showScriptBlockingWarning(reason) {
                if (window.__ddgScriptBlockingWarned) {
                    return;
                }

                window.__ddgScriptBlockingWarned = true;

                try {
                    console.warn("Scripts required to run DDGame were blocked.", reason);
                } catch (error) {
                    /* no-op */
                }

                const loadingMessage = document.getElementById("loading-message");
                if (loadingMessage) {
                    loadingMessage.textContent = WARNING_TEXT;
                }

                const loadingContainer = document.getElementById("loading-container");
                if (loadingContainer) {
                    loadingContainer.classList.add("script-blocked");

                    const existingInstructions = document.getElementById("script-blocking-instructions");
                    if (!existingInstructions) {
                        const instructions = document.createElement("p");
                        instructions.id = "script-blocking-instructions";
                        instructions.className = "script-blocking-instructions";
                        instructions.textContent = INSTRUCTIONS_TEXT;
                        loadingContainer.appendChild(instructions);
                    }
                }

                const blazorErrorUi = document.getElementById("blazor-error-ui");
                if (blazorErrorUi) {
                    blazorErrorUi.style.display = "block";
                    blazorErrorUi.classList.add("script-blocked");

                    const messageElement = blazorErrorUi.querySelector(".message");
                    if (messageElement) {
                        messageElement.textContent = WARNING_TEXT;
                    }

                    const reloadLink = blazorErrorUi.querySelector("a.reload");
                    if (reloadLink) {
                        reloadLink.textContent = "Reload";
                    }

                    const dismissButton = blazorErrorUi.querySelector(".dismiss");
                    if (dismissButton) {
                        dismissButton.remove();
                    }
                }
            }

            window.__ddgShowScriptBlockingWarning = showScriptBlockingWarning;

            window.__ddgMarkBlazorStarted = function () {
                window.__ddgBlazorStarted = true;

                if (window.__ddgBlazorStartupTimer) {
                    window.clearTimeout(window.__ddgBlazorStartupTimer);
                    window.__ddgBlazorStartupTimer = undefined;
                }
            };

            window.__ddgBlazorStartupTimer = window.setTimeout(function () {
                if (!window.__ddgBlazorStarted) {
                    showScriptBlockingWarning(new Error("Blazor did not start within the expected time window."));
                }
            }, 15000);

            registerRecoveryRestartHandler();
        })();
    </script>

    <script src="_framework/blazor.webassembly.js"
            onload="window.__ddgMarkBlazorStarted && window.__ddgMarkBlazorStarted();"
            onerror="window.__ddgShowScriptBlockingWarning && window.__ddgShowScriptBlockingWarning('The Blazor framework script failed to load.');"></script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script type="module" src="js/main.mjs"></script>
</body>

</html>

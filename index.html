<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Game</title>

    <!-- Hosted at the root of dd-game.hmason55.dev -->
    <base href="/" />

    <script>
        // GitHub Pages can serve the game shell as the site's fallback.
        if (/^\/editor\/?$/i.test(location.pathname)) {
            location.replace("/editor/index.html" + location.search + location.hash);
        }
    </script>

    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="theme-color" content="#0b1622">
    <link rel="stylesheet" href="css/base/typography.css" />
    <link rel="stylesheet" href="css/base/global.css" />
    <link rel="stylesheet" href="css/components/enemy.css" />
    <link rel="stylesheet" href="css/components/map.css" />
    <link rel="stylesheet" href="css/components/progression.css" />
    <link rel="stylesheet" href="css/components/backpack-dialog.css" />
    <!--<link rel="stylesheet" href="css/utilities/visual-effects.css" />-->
    <link rel="stylesheet" href="css/components/loading.css" />
    <link rel="stylesheet" href="css/components/error.css" />
    <link href="DDGame.styles.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/TextPlugin.min.js"></script>
</head>

<body>

    <div id="app" class="content">
        <div id="loading-container" class="loading-container" role="status" aria-live="polite" aria-busy="true">
            <div class="loading-mark" aria-hidden="true"></div>
            <p id="loading-message" class="loading-message">Loading…</p>
            <div class="loading-progress" aria-hidden="true">
                <div class="loading-bar"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span class="message">An unexpected error occurred.</span>
        <a href="." class="reload">Restart</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        (() => {
            let started = false;
            const showStartupError = (error) => {
                const loading = document.getElementById("loading-container");
                if (started || !loading || loading.classList.contains("script-blocked")) return;

                console.warn("DDGame startup did not complete.", error);
                loading.classList.add("script-blocked");
                loading.setAttribute("aria-busy", "false");
                document.getElementById("loading-message").textContent = "The game couldn't finish loading.";

                const instructions = document.createElement("p");
                instructions.className = "script-blocking-instructions";
                instructions.textContent = "If loading keeps failing, check your connection and allow this site's scripts.";
                const retry = document.createElement("a");
                retry.href = location.href;
                retry.textContent = "Reload";
                loading.append(instructions, retry);
            };

            const watchdog = window.setTimeout(() => showStartupError("Startup timed out."), 15000);
            window.__ddgMarkBlazorStarted = () => {
                started = true;
                window.clearTimeout(watchdog);
            };
            window.__ddgShowStartupError = showStartupError;
        })();
    </script>

    <script src="_framework/blazor.webassembly.js" autostart="false"
            onload="Blazor.start().catch(window.__ddgShowStartupError);"
            onerror="window.__ddgShowStartupError('The Blazor framework script failed to load.');"></script>

    <script type="module" src="js/main.mjs"></script>
</body>

</html>
